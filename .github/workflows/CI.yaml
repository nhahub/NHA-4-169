name: CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

jobs:

  # =========================
  # Backend CI
  # =========================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./backend(.net)/BayTack/BayTack.slnx

      - name: Build
        run: dotnet build ./backend(.net)/BayTack/BayTack.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ./backend(.net)/BayTack/BayTack.slnx --configuration Release --no-build

      - name: Publish
        run: dotnet publish ./backend(.net)/BayTack/BayTack.slnx --configuration Release --output ./artifacts/backend

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifact
          path: ./artifacts/backend
